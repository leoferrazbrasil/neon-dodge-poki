<!doctype html>
<meta charset="utf-8">
<title>Neon Dodge — rasterizador de capas</title>
<style>body{background:#0b0e22;color:#e9ecff;font:14px system-ui;padding:24px}a{color:#20c7f5;display:block;margin:8px 0}</style>
<h1>Rasterizador de capas</h1>
<p>Converte os SVG determinísticos de <code>store/covers/</code> em PNG nos formatos exigidos.</p>
<div id="saida">Carregando…</div>
<script type="module">
const FORMATOS = [
  { id: 'landscape', width: 1920, height: 1080 },
  { id: 'portrait', width: 800, height: 1200 },
  { id: 'square', width: 800, height: 800 },
  { id: 'thumbnail-628', width: 628, height: 628 }
];
window.rasterizar = async () => {
  const saida = document.querySelector('#saida');
  saida.textContent = '';
  const resultado = {};
  for (const formato of FORMATOS) {
    const texto = await (await fetch('../store/covers/' + formato.id + '.svg')).text();
    const url = URL.createObjectURL(new Blob([texto], { type: 'image/svg+xml;charset=utf-8' }));
    const img = new Image();
    await new Promise((ok, err) => { img.onload = ok; img.onerror = err; img.src = url; });
    const canvas = document.createElement('canvas');
    canvas.width = formato.width;
    canvas.height = formato.height;
    canvas.getContext('2d').drawImage(img, 0, 0, formato.width, formato.height);
    URL.revokeObjectURL(url);
    const dataUrl = canvas.toDataURL('image/png');
    resultado[formato.id] = dataUrl.split(',')[1];
    const link = document.createElement('a');
    link.href = dataUrl;
    link.download = formato.id + '.png';
    link.textContent = `Baixar ${formato.id}.png (${formato.width}x${formato.height}, ${Math.round(dataUrl.length * 0.75 / 1024)} KB)`;
    saida.append(link);
  }
  window.__png = resultado;
  return Object.fromEntries(Object.entries(resultado).map(([k, v]) => [k, Math.round(v.length * 0.75 / 1024) + ' KB']));
};
window.rasterizar();
</script>
