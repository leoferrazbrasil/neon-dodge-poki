<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; font-src 'none'; media-src 'none'">
  <title>Neon Dodge</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main id="game-shell" class="game-shell" data-state="Booting">
    <section class="game-frame" aria-label="Neon Dodge game">
      <canvas id="game-canvas" width="1031" height="580" aria-label="Neon Dodge playfield"></canvas>
      <div class="screen-ui">
        <header class="hud" aria-live="polite">
          <div class="brand-mark" id="game-title" data-i18n="title">Neon Dodge</div>
          <div class="score-group"><span id="score-label" data-i18n="score">Score</span><strong id="score-value">0</strong></div>
          <div class="score-group"><span id="best-label" data-i18n="best">Best</span><strong id="best-value">0</strong></div>
          <button id="menu-button" class="hud-button" type="button" data-action="menu" aria-label="Open menu">•••</button>
          <button id="pause-button" class="hud-button" type="button" data-action="pause" aria-label="Pause game">Ⅱ</button>
        </header>

        <section id="ready-panel" class="state-panel" hidden>
          <p class="eyebrow" data-i18n="title">NEON DODGE</p>
          <h1 id="start-label" data-i18n="start">Tap to start</h1>
          <p id="hint-label" data-i18n="hint">Switch lanes. Stay alive.</p>
        </section>

        <section id="pause-panel" class="state-panel" hidden>
          <p class="eyebrow" data-i18n="paused">PAUSED</p>
          <h2 data-i18n="takeABreath">Take a breath.</h2>
          <button class="primary-button" type="button" data-action="resume" data-i18n="resume">Resume</button>
        </section>

        <section id="menu-panel" class="state-panel" hidden>
          <p class="eyebrow" data-i18n="menu">MENU</p>
          <h2 data-i18n="readyWhen">Ready when you are.</h2>
          <button class="primary-button" type="button" data-action="resume" data-i18n="resume">Resume</button>
        </section>

        <section id="game-over-panel" class="state-panel" hidden>
          <p class="eyebrow" data-i18n="runComplete">RUN COMPLETE</p>
          <h2 data-i18n="oneMore">One more?</h2>
          <button id="restart-button" class="primary-button" type="button" data-action="restart">Restart</button>
        </section>

        <p id="storage-notice" class="storage-notice" hidden role="status"></p>
        <div class="mobile-controls" aria-label="Touch controls">
          <button class="touch-button" type="button" data-action="switch-lane" aria-label="Switch lane">↕</button>
        </div>
      </div>
    </section>
  </main>
  <script id="strings-data" type="application/json">
    {

      "pt-BR": { "title": "Neon Dodge", "start": "Toque para começar", "hint": "Troque de faixa. Continue vivo.", "paused": "PAUSADO", "takeABreath": "Respire um pouco.", "menu": "MENU", "readyWhen": "Quando quiser, estamos prontos.", "runComplete": "FIM DA RODADA", "oneMore": "Mais uma?", "pause": "Pausar", "resume": "Continuar", "restart": "Reiniciar", "score": "Pontos", "best": "Recorde", "storageNotice": "A pontuação desta sessão não será salva." },
      "es": { "title": "Neon Dodge", "start": "Toca para empezar", "pause": "Pausa", "resume": "Continuar", "restart": "Reiniciar", "score": "Puntuación", "best": "Mejor", "storageNotice": "La puntuación de esta sesión no se guardará." },
      "fr": { "title": "Neon Dodge", "start": "Touchez pour commencer", "pause": "Pause", "resume": "Reprendre", "restart": "Recommencer", "score": "Score", "best": "Record", "storageNotice": "Le score de cette session ne sera pas sauvegardé." },
      "it": { "title": "Neon Dodge", "start": "Tocca per iniziare", "pause": "Pausa", "resume": "Riprendi", "restart": "Ricomincia", "score": "Punteggio", "best": "Record", "storageNotice": "Il punteggio di questa sessione non verrà salvato." },
      "de": { "title": "Neon Dodge", "start": "Tippen zum Starten", "pause": "Pause", "resume": "Fortsetzen", "restart": "Neustart", "score": "Punkte", "best": "Bestwert", "storageNotice": "Der Punktestand dieser Sitzung wird nicht gespeichert." },
      "tr": { "title": "Neon Dodge", "start": "Başlamak için dokun", "pause": "Duraklat", "resume": "Devam et", "restart": "Yeniden başlat", "score": "Skor", "best": "En iyi", "storageNotice": "Bu oturumun skoru kaydedilmeyecek." }

  </script>
  <script type="module" src="./game.js"></script>
</body>
</html>
