<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; font-src 'none'; media-src 'none'">
  <title>Neon Dodge</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main id="game-shell" class="game-shell" data-state="Booting">
    <section class="game-frame" aria-label="Neon Dodge game">
      <canvas id="game-canvas" width="1031" height="580" aria-label="Neon Dodge playfield"></canvas>
      <div class="screen-ui">
        <header class="hud" aria-live="polite">
          <div class="brand-mark" id="game-title" data-i18n="title">Neon Dodge</div>
          <div class="score-group"><span id="score-label" data-i18n="score">Score</span><strong id="score-value">0</strong></div>
          <div class="score-group"><span id="best-label" data-i18n="best">Best</span><strong id="best-value">0</strong></div>
          <button id="menu-button" class="hud-button" type="button" data-action="menu" aria-label="Open menu">•••</button>
          <button id="pause-button" class="hud-button" type="button" data-action="pause" aria-label="Pause game">Ⅱ</button>
        </header>

        <p id="playing-hint" class="playing-hint" data-i18n="controlHint" hidden>Each tap switches lanes</p>

        <section id="ready-panel" class="state-panel" hidden>
          <p class="eyebrow" data-i18n="title">NEON DODGE</p>
          <h1 id="start-label" data-i18n="start">Tap to start</h1>
          <p id="hint-label" data-i18n="controlHint">Each tap switches lanes</p>
          <p id="ready-progression" class="progression-copy" aria-live="polite"></p>
          <button id="customize-button" class="secondary-button" type="button" data-action="customize" data-i18n="customize">Customize</button>
        </section>

        <section id="pause-panel" class="state-panel" hidden>
          <p class="eyebrow" data-i18n="paused">PAUSED</p>
          <h2 data-i18n="takeABreath">Take a breath.</h2>
          <button class="primary-button" type="button" data-action="resume" data-i18n="resume">Resume</button>
        </section>

        <section id="menu-panel" class="state-panel menu-panel" hidden>
          <p class="eyebrow" data-i18n="menu">MENU</p>
          <h2 data-i18n="readyWhen">Ready when you are.</h2>
          <h3 id="collection-title" data-i18n="collection">Neon collection</h3>
          <div id="loadout-list" class="loadout-list" aria-live="polite"></div>
          <button class="primary-button" type="button" data-action="resume" data-i18n="resume">Resume</button>
        </section>

        <section id="game-over-panel" class="state-panel" hidden>
          <p class="eyebrow" data-i18n="runComplete">RUN COMPLETE</p>
          <h2 data-i18n="oneMore">One more?</h2>
          <p id="game-over-reward" class="reward-copy" aria-live="polite"></p>
          <p id="game-over-next" class="progression-copy" aria-live="polite"></p>
          <button id="restart-button" class="primary-button" type="button" data-action="restart">Restart</button>
        </section>

        <p id="storage-notice" class="storage-notice" hidden role="status"></p>
        <div id="mobile-controls" class="mobile-controls" hidden aria-label="Touch controls">
          <button class="touch-button" type="button" data-action="switch-lane" aria-label="Switch lane">↕</button>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="./game.js"></script>
</body>
</html>
